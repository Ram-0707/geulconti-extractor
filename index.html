<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>글콘티 대사 추출기</title>
<style>
:root{
  --bg:#f6f6f4; --panel:#fff; --line:#e3e2dd; --text:#1c1b19; --dim:#78766f;
  --accent:#b4522a; --accent-soft:#f6ece7; --ok:#2f6f4e; --shadow:0 1px 2px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#171614;--panel:#201f1c;--line:#33312d;--text:#eceae5;--dim:#96938b;
        --accent:#e0855c;--accent-soft:#2e2622;--ok:#7fc4a0;--shadow:0 1px 2px rgba(0,0,0,.3);}
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);
  font-family:Pretendard,"맑은 고딕","Malgun Gothic",system-ui,-apple-system,sans-serif;
  font-size:14px;line-height:1.6;}
header{padding:22px 24px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
h1{margin:0;font-size:17px;font-weight:650;letter-spacing:-.2px}
header p{margin:4px 0 0;color:var(--dim);font-size:12.5px}
main{max-width:1180px;margin:0 auto;padding:20px 24px 80px}
.drop{border:2px dashed var(--line);border-radius:12px;padding:34px 20px;text-align:center;
  background:var(--panel);cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.drop:hover,.drop.over{border-color:var(--accent);background:var(--accent-soft)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.drop span{color:var(--dim);font-size:12.5px}
.tabs{display:flex;gap:4px;margin-bottom:10px}
.tabs button{border-radius:8px 8px 0 0;border-bottom-color:transparent;color:var(--dim)}
.tabs button.sel{background:var(--panel);border-color:var(--line);border-bottom-color:var(--panel);
  color:var(--accent);font-weight:650}
.paste{background:var(--panel);border:1px solid var(--line);border-radius:12px;
  padding:14px 16px;box-shadow:var(--shadow)}
.paste textarea{width:100%;min-height:150px;border:1px solid var(--line);border-radius:8px;
  background:var(--bg);color:var(--text);font:inherit;font-size:13.5px;line-height:1.7;
  padding:10px 12px;resize:vertical;tab-size:8}
.paste textarea:focus{outline:0;border-color:var(--accent)}
.paste .foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:10px}
.paste .hint{color:var(--dim);font-size:12px;margin-right:auto}
kbd{background:var(--bg);border:1px solid var(--line);border-radius:4px;
  padding:1px 5px;font-size:11px;font-family:inherit}
.opts{display:flex;flex-wrap:wrap;gap:6px 18px;margin:18px 0 14px;padding:14px 16px;
  background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.opts label{display:flex;align-items:center;gap:7px;font-size:13px;cursor:pointer;user-select:none}
.opts input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-bottom:12px}
.bar .stat{color:var(--dim);font-size:12.5px;margin-right:auto}
button{font:inherit;font-size:13px;padding:7px 14px;border-radius:7px;border:1px solid var(--line);
  background:var(--panel);color:var(--text);cursor:pointer;transition:.12s}
button:hover{border-color:var(--accent);color:var(--accent)}
button.pri{background:var(--accent);border-color:var(--accent);color:#fff}
button.pri:hover{opacity:.88;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;
  box-shadow:var(--shadow);overflow:hidden}
.panel h2{margin:0;padding:11px 14px;font-size:12px;font-weight:650;letter-spacing:.3px;
  color:var(--dim);border-bottom:1px solid var(--line)}
.rows{max-height:62vh;overflow:auto}
.row{display:grid;grid-template-columns:26px 1fr;gap:8px;padding:8px 12px;
  border-bottom:1px solid var(--line);align-items:start}
.row:last-child{border-bottom:0}
.row.off{opacity:.42}
.row.filehdr{grid-template-columns:1fr;background:var(--accent-soft);font-weight:650;
  font-size:12px;color:var(--accent)}
.row input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px;margin:3px 0 0}
.src{color:var(--dim);font-size:11.5px;white-space:pre-wrap;word-break:break-all;margin-bottom:3px}
.out{width:100%;border:0;background:transparent;color:var(--text);font:inherit;font-size:13.5px;
  padding:2px 4px;border-radius:4px;resize:vertical;min-height:22px;overflow:hidden;line-height:1.5}
.out:focus{outline:1px solid var(--accent);background:var(--bg)}
.row.manual .out{color:var(--ok)}
#result{width:100%;min-height:62vh;border:0;padding:12px 14px;background:transparent;color:var(--text);
  font:inherit;font-size:13.5px;line-height:1.75;resize:vertical}
#result:focus{outline:0}
.empty{padding:30px 14px;text-align:center;color:var(--dim);font-size:13px}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
  background:var(--text);color:var(--bg);padding:9px 18px;border-radius:20px;font-size:13px;
  opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <h1>글콘티 대사 추출기</h1>
  <p>워드(.docx) 파일을 열거나 글을 그대로 붙여넣으면 대사만 뽑아냅니다. 모든 처리는 브라우저 안에서만 이뤄지고 어디로도 전송되지 않습니다.</p>
</header>

<main>
  <div class="tabs">
    <button id="tabFile" class="sel">워드 파일 열기</button>
    <button id="tabPaste">직접 붙여넣기</button>
  </div>

  <div class="drop" id="drop">
    <b>여기에 .docx 파일을 끌어다 놓으세요</b>
    <span>클릭해서 고를 수도 있습니다 · 여러 개 한꺼번에 가능</span>
    <input type="file" id="file" accept=".docx" multiple hidden>
  </div>

  <div class="paste" id="paste" hidden>
    <textarea id="pasteText" spellcheck="false"
      placeholder="워드에서 글콘티를 복사해 여기에 붙여넣으세요.&#10;표를 통째로 복사해도 칸 구분(탭)이 그대로 살아 있어 대사 칸을 알아냅니다."></textarea>
    <div class="foot">
      <span class="hint">붙여넣으면 바로 추출됩니다 · <kbd>Ctrl</kbd>+<kbd>Enter</kbd> 로 다시 추출</span>
      <button id="btnClearPaste">비우기</button>
      <button class="pri" id="btnRunPaste">대사 뽑기</button>
    </div>
  </div>

  <div class="opts">
    <label><input type="checkbox" id="o_quote" checked> 따옴표 안 대사 뽑기</label>
    <label><input type="checkbox" id="o_tab" checked> 화자명 뒤(탭·표 칸) 대사 뽑기</label>
    <label><input type="checkbox" id="o_space"> 두 칸 이상 띄어쓰기도 구분자로</label>
    <label><input type="checkbox" id="o_indent" checked> 들여쓴 이어지는 줄도 대사로</label>
    <label><input type="checkbox" id="o_merge"> 이어지는 줄 앞 대사에 붙이기</label>
    <label><input type="checkbox" id="o_speaker"> 화자명 함께 남기기</label>
    <label><input type="checkbox" id="o_paren"> 괄호 ( ) 안 지시문 지우기</label>
    <label><input type="checkbox" id="o_blank"> 빈 줄로 문단 나누기</label>
  </div>

  <div class="bar">
    <span class="stat" id="stat">워드 파일을 열거나 글을 붙여넣으세요.</span>
    <button id="btnAll">전체 켜기</button>
    <button id="btnNone">전체 끄기</button>
    <button id="btnCopy">결과 복사</button>
    <button id="btnTxt">.txt 저장</button>
    <button class="pri" id="btnDocx">.docx 저장</button>
  </div>

  <div class="grid">
    <div class="panel">
      <h2>원본 → 추출 &nbsp;<span style="font-weight:400;text-transform:none">체크를 켜면 결과에 더해지고 풀면 빠집니다 · 글자는 직접 고칠 수 있습니다</span></h2>
      <div class="rows" id="rows"><div class="empty">아직 넣은 글이 없습니다.</div></div>
    </div>
    <div class="panel">
      <h2>결과 <span id="cnt" style="font-weight:400"></span></h2>
      <textarea id="result" spellcheck="false" placeholder="추출된 대사가 여기에 모입니다."></textarea>
    </div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
'use strict';

/* ── ZIP 읽기 : 브라우저 내장 DecompressionStream 사용 (외부 라이브러리 없음) ── */
async function unzip(buf){
  const dv=new DataView(buf), u8=new Uint8Array(buf);
  let eocd=-1;
  for(let i=u8.length-22;i>=0 && i>u8.length-66000;i--){
    if(dv.getUint32(i,true)===0x06054b50){eocd=i;break;}
  }
  if(eocd<0) throw new Error('ZIP 구조를 찾지 못했습니다');
  const count=dv.getUint16(eocd+10,true);
  const cdOff=dv.getUint32(eocd+16,true);
  const files={};
  let p=cdOff;
  for(let n=0;n<count;n++){
    if(dv.getUint32(p,true)!==0x02014b50) break;
    const method=dv.getUint16(p+10,true);
    const csize=dv.getUint32(p+20,true);
    const fnLen=dv.getUint16(p+28,true);
    const exLen=dv.getUint16(p+30,true);
    const cmLen=dv.getUint16(p+32,true);
    const lho=dv.getUint32(p+42,true);
    const name=new TextDecoder('utf-8').decode(u8.subarray(p+46,p+46+fnLen));
    const lfn=dv.getUint16(lho+26,true), lex=dv.getUint16(lho+28,true);
    const start=lho+30+lfn+lex;
    files[name]={method,bytes:u8.subarray(start,start+csize)};
    p+=46+fnLen+exLen+cmLen;
  }
  return {
    async text(name){
      const f=files[name]; if(!f) return null;
      if(f.method===0) return new TextDecoder('utf-8').decode(f.bytes);
      const ds=new DecompressionStream('deflate-raw');
      const out=await new Response(new Blob([f.bytes]).stream().pipeThrough(ds)).arrayBuffer();
      return new TextDecoder('utf-8').decode(out);
    }
  };
}

/* ── ZIP 쓰기 : 무압축(STORE) 방식으로 .docx 만들기 ── */
const CRCT=(function(){
  const t=new Uint32Array(256);
  for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1);t[i]=c>>>0;}
  return t;
})();
function crc32(b){let c=0xFFFFFFFF;for(let i=0;i<b.length;i++)c=CRCT[(c^b[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function makeZip(entries){
  const enc=new TextEncoder(), parts=[], centrals=[]; let off=0;
  for(const pair of entries){
    const nb=enc.encode(pair[0]), db=enc.encode(pair[1]), crc=crc32(db);
    const lh=new Uint8Array(30+nb.length), lv=new DataView(lh.buffer);
    lv.setUint32(0,0x04034b50,true); lv.setUint16(4,20,true); lv.setUint16(6,0x800,true);
    lv.setUint16(8,0,true); lv.setUint32(14,crc,true);
    lv.setUint32(18,db.length,true); lv.setUint32(22,db.length,true);
    lv.setUint16(26,nb.length,true); lh.set(nb,30);
    parts.push(lh,db);
    const ch=new Uint8Array(46+nb.length), cv=new DataView(ch.buffer);
    cv.setUint32(0,0x02014b50,true); cv.setUint16(4,20,true); cv.setUint16(6,20,true);
    cv.setUint16(8,0x800,true); cv.setUint16(10,0,true); cv.setUint32(16,crc,true);
    cv.setUint32(20,db.length,true); cv.setUint32(24,db.length,true);
    cv.setUint16(28,nb.length,true); cv.setUint32(42,off,true); ch.set(nb,46);
    centrals.push(ch);
    off+=lh.length+db.length;
  }
  let cdSize=0; centrals.forEach(function(c){cdSize+=c.length;});
  const eo=new Uint8Array(22), ev=new DataView(eo.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,centrals.length,true);
  ev.setUint16(10,centrals.length,true); ev.setUint32(12,cdSize,true); ev.setUint32(16,off,true);
  return new Blob(parts.concat(centrals,[eo]),
    {type:'application/vnd.openxmlformats-officedocument.wordprocessingml.document'});
}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function buildDocx(lines){
  const ps=lines.map(function(t){
    return t.trim()===''? '<w:p/>'
      : '<w:p><w:r><w:t xml:space="preserve">'+esc(t)+'</w:t></w:r></w:p>';
  }).join('');
  const doc='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'+
    '<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'+
    '<w:body>'+ps+'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/></w:sectPr></w:body></w:document>';
  return makeZip([
    ['[Content_Types].xml','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/></Types>'],
    ['_rels/.rels','<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/></Relationships>'],
    ['word/document.xml',doc]
  ]);
}

/* ── document.xml → 줄 목록 (문단 + 표 지원) ── */
function paraText(p){
  let s='';
  (function walk(n){
    for(const c of n.childNodes){
      if(c.nodeType!==1) continue;
      const ln=c.localName;
      if(ln==='t') s+=c.textContent;
      else if(ln==='tab') s+='\t';
      else if(ln==='br'||ln==='cr') s+='\n';
      else if(ln!=='del'&&ln!=='instrText') walk(c);
    }
  })(p);
  return s;
}
function childrenNamed(el,name){
  return Array.prototype.filter.call(el.childNodes,function(n){return n.localName===name;});
}
const W='http://schemas.openxmlformats.org/wordprocessingml/2006/main';
function attrW(el,name){
  return el.getAttributeNS(W,name) || el.getAttribute('w:'+name) || el.getAttribute(name) || '';
}
// 문단의 왼쪽 들여쓰기(트윕 단위, 1인치=1440). 직접 지정값이 없으면 문단 스타일에서 물려받습니다.
function indentOf(p,styleInd){
  const pPr=childrenNamed(p,'pPr')[0];
  if(!pPr) return 0;
  const ind=childrenNamed(pPr,'ind')[0];
  if(ind){
    const left=parseInt(attrW(ind,'left')||attrW(ind,'start'),10)||0;
    const first=parseInt(attrW(ind,'firstLine'),10)||0;
    const hang=parseInt(attrW(ind,'hanging'),10)||0;
    const v=left+first-hang;
    if(left||first||hang) return v>0?v:0;
  }
  const st=childrenNamed(pPr,'pStyle')[0];
  const id=st?attrW(st,'val'):'';
  return (id && styleInd[id])||0;
}
// styles.xml 에서 스타일별 들여쓰기를 미리 뽑아둡니다(basedOn 상속까지).
function styleIndents(xml){
  const map={},based={};
  if(!xml) return map;
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.getElementsByTagName('parsererror').length) return map;
  Array.prototype.forEach.call(doc.getElementsByTagName('*'),function(st){
    if(st.localName!=='style') return;
    const id=attrW(st,'styleId'); if(!id) return;
    const pPr=childrenNamed(st,'pPr')[0];
    const b=childrenNamed(st,'basedOn')[0];
    if(b) based[id]=attrW(b,'val');
    const ind=pPr?childrenNamed(pPr,'ind')[0]:null;
    if(ind){
      const v=(parseInt(attrW(ind,'left')||attrW(ind,'start'),10)||0)
             +(parseInt(attrW(ind,'firstLine'),10)||0)
             -(parseInt(attrW(ind,'hanging'),10)||0);
      map[id]=v>0?v:0;
    }
  });
  Object.keys(based).forEach(function(id){           // 상속 해결 (순환 방지용 깊이 제한)
    let cur=id,depth=0;
    while(map[cur]==null && based[cur] && depth++<10) cur=based[cur];
    if(map[id]==null && map[cur]!=null) map[id]=map[cur];
  });
  return map;
}
function docLines(xml,stylesXml){
  const doc=new DOMParser().parseFromString(xml,'application/xml');
  if(doc.getElementsByTagName('parsererror').length) throw new Error('문서 XML 해석 실패');
  const body=Array.prototype.find.call(doc.documentElement.childNodes,function(n){return n.localName==='body';});
  if(!body) return [];
  const styleInd=styleIndents(stylesXml), out=[];
  Array.prototype.forEach.call(body.childNodes,function(n){
    if(n.nodeType!==1) return;
    if(n.localName==='p'){
      const ind=indentOf(n,styleInd);
      // 한 문단 안의 줄바꿈(Shift+Enter)으로 생긴 뒷줄은 앞 대사의 이어짐으로 표시합니다.
      paraText(n).split('\n').forEach(function(t,i){out.push({src:t,indent:ind,cont:i>0});});
    }else if(n.localName==='tbl'){
      childrenNamed(n,'tr').forEach(function(tr){
        const cells=childrenNamed(tr,'tc').map(function(tc){
          return Array.prototype.filter.call(tc.getElementsByTagName('*'),function(x){return x.localName==='p';})
            .map(paraText).join(' ').replace(/\s+/g,' ').trim();
        });
        out.push({src:cells.join('\t'),indent:0,cont:false});
      });
    }
  });
  return out;
}

/* ── 대사 추출 규칙 ── */
// 워드를 거치면 따옴표의 여는/닫는 모양이 자주 어긋납니다(”대사”, “대사“, 전각 ＂대사＂ 등).
// 그래서 짝을 따지지 않고 "따옴표 문자가 나오면 열고, 다음 따옴표 문자에서 닫는" 식으로 훑습니다.
const DQ='"“”〝〞〟＂″‶';   // 큰따옴표 계열
const SQ='\'‘’＇′‵';                     // 작은따옴표 계열
const BRACKETS=[['「','」'],['『','』'],['《','》'],['〈','〉'],['｢','｣']];
const OPENER=new RegExp('['+DQ+SQ+'「『《〈｢]');

function scanSym(line,chars){
  const spans=[]; let i=0;
  while(i<line.length){
    if(chars.indexOf(line[i])<0){ i++; continue; }
    let j=i+1;
    while(j<line.length && chars.indexOf(line[j])<0) j++;
    const t=line.slice(i+1,j).trim();
    if(t) spans.push({s:i,e:j,t:t,closed:j<line.length});
    i=j+1;
  }
  return spans;
}
function scanBracket(line){
  const spans=[];
  BRACKETS.forEach(function(p){
    let i=0;
    for(;;){
      const s=line.indexOf(p[0],i); if(s<0) break;
      let e=line.indexOf(p[1],s+1); if(e<0) e=line.length;
      const t=line.slice(s+1,e).trim();
      if(t) spans.push({s:s,e:e,t:t,closed:true});
      i=e+1;
    }
  });
  return spans;
}
// 괄호 구간. 그 안의 작은따옴표는 대사가 아니라 식자·연출 지시입니다.
//   예) 그걸 써먹을 줄 아는 느낌이야. (보조식자 ‘눈웃음 보게나’)
function parenSpans(line){
  const spans=[]; let depth=0, start=-1;
  for(let i=0;i<line.length;i++){
    const c=line[i];
    if(c==='('||c==='（'){ if(depth===0) start=i; depth++; }
    else if(c===')'||c==='）'){
      if(depth>0 && --depth===0 && start>=0){ spans.push([start,i]); start=-1; }
    }
  }
  return spans;
}
function pullQuotes(line){
  const par=parenSpans(line);
  function inParen(i){ return par.some(function(r){return i>r[0] && i<r[1];}); }
  // 작은따옴표는 대사 안의 강조인 경우가 많아(“정말 ‘그것’이 맞아?”) 짝이 맞을 때만 후보로 두고,
  // 괄호 안에 든 것은 지시문이므로 제외합니다.
  // 큰따옴표 구간 안에 들어 있으면 아래 겹침 정리에서 자연히 걸러집니다.
  const spans=scanBracket(line)
    .concat(scanSym(line,DQ))
    .concat(scanSym(line,SQ).filter(function(sp){return sp.closed && !inParen(sp.s);}));
  spans.sort(function(a,b){return a.s-b.s || b.e-a.e;});
  const out=[]; let end=-1;
  spans.forEach(function(sp){ if(sp.s>end){ out.push(sp.t); end=sp.e; } });   // 바깥쪽 구간만
  return out;
}
function looksLikeSpeaker(s){
  if(!s) return false;
  const t=s.replace(/\([^)]*\)/g,'').replace(/[\[\]]/g,'').trim();
  return t.length>0 && t.length<=12 && !/[.!?~…]$/.test(t);
}
function extract(line,o){
  const raw=line.replace(/ /g,' ').replace(/[ \t]+$/,'');
  if(!raw.trim()) return {text:'',speaker:''};

  if(o.quote){
    const q=pullQuotes(raw);
    if(q.length){
      let sp='';
      const at=raw.search(OPENER);
      const head=at>0?raw.slice(0,at).trim():'';
      if(head){
        const w=head.split(/[\s\t]+/).filter(Boolean);
        if(w.length) sp=w[w.length-1];
      }
      return {text:q.join(' '),speaker:sp};
    }
  }
  if(o.tab && raw.indexOf('\t')>=0){
    const filled=raw.split('\t').map(function(s){return s.trim();}).filter(Boolean);
    if(filled.length>=2){
      const speaker=filled[filled.length-2], bodyText=filled[filled.length-1];
      return {text:bodyText,speaker:looksLikeSpeaker(speaker)?speaker:''};
    }
    return {text:'',speaker:''};
  }
  if(o.space){
    const m=raw.match(/^\s*(\S[^\s]{0,18})\s{2,}(\S[\s\S]*)$/);
    if(m && looksLikeSpeaker(m[1])) return {text:m[2].trim(),speaker:m[1]};
  }
  return {text:'',speaker:''};
}
function stripEdgeQuotes(s){
  return s.replace(new RegExp('^['+DQ+SQ+']+'),'').replace(new RegExp('['+DQ+SQ+']+$'),'').trim();
}
function polish(t,o){
  let s=t;
  if(o.paren) s=s.replace(/\([^()]*\)/g,'').replace(/（[^（）]*）/g,'');
  return s.replace(/\s+/g,' ').trim();
}

/* ── 상태 & 화면 ── */
let files=[], rowCount=0;
function $(id){return document.getElementById(id);}
function opts(){return{
  quote:$('o_quote').checked, tab:$('o_tab').checked, space:$('o_space').checked,
  speaker:$('o_speaker').checked, paren:$('o_paren').checked, blank:$('o_blank').checked,
  indent:$('o_indent').checked, merge:$('o_merge').checked};}

const INDENT_MIN=100;   // 트윕(1인치=1440). 이보다 들여쓰였으면 이어지는 대사로 봅니다.

function recompute(){
  const o=opts();
  files.forEach(function(f){
    f.lines.forEach(function(L){
      if(L.edited) return;
      const r=extract(L.src,o);
      L.speaker=r.speaker;
      L.text=polish(r.text,o);
      L.on=!!L.text;
      L.contOf=false;
    });
    // 대사 바로 뒤에 오는 "이어지는 줄" 잇기.
    // 워드 들여쓰기가 있거나, 한 문단 안의 줄바꿈(Shift+Enter)으로 생긴 줄이 해당합니다.
    let prevDialogue=false;
    f.lines.forEach(function(L){
      if(!L.src.trim()){ prevDialogue=false; return; }   // 빈 줄에서 끊깁니다
      if(L.text.trim()){ prevDialogue=true; return; }
      if(L.edited) return;
      if(prevDialogue && o.indent && (L.cont || L.indent>=INDENT_MIN)){
        // 줄 끝에 걸친 따옴표 조각("…날이야!")은 떼고 줄 전체를 대사로 씁니다
        L.text=polish(stripEdgeQuotes(L.src.replace(/\t/g,' ')),o);
        L.speaker=''; L.contOf=true; L.on=!!L.text;
        prevDialogue=!!L.text;
      }else{
        prevDialogue=false;
      }
    });
  });
  render();
}
function lineOut(L,o){
  return (o.speaker && L.speaker ? L.speaker+': ' : '')+L.text;
}
// 자동 추출에서 빠진 줄을 사용자가 직접 켰을 때 채워 넣을 기본값.
// 표/탭이 있으면 마지막 칸(대사일 가능성이 가장 높은 칸)을, 아니면 줄 전체를 씁니다.
function fallbackText(L){
  const cells=L.src.split('\t').map(function(s){return s.trim();}).filter(Boolean);
  const pick=cells.length>1?cells[cells.length-1]:L.src;
  return pick.replace(/\s+/g,' ').trim();
}
function grow(ta){ta.style.height='auto';ta.style.height=ta.scrollHeight+'px';}

function render(){
  const o=opts(), box=$('rows');
  if(!files.length){
    box.innerHTML='<div class="empty">아직 넣은 글이 없습니다.</div>';
    $('result').value=''; $('stat').textContent='워드 파일을 열거나 글을 붙여넣으세요.'; $('cnt').textContent='';
    return;
  }
  const frag=document.createDocumentFragment();
  let total=0;
  files.forEach(function(f){
    if(files.length>1){
      const h=document.createElement('div');
      h.className='row filehdr'; h.textContent=f.name; frag.appendChild(h);
    }
    f.lines.forEach(function(L){
      if(!L.src.trim() && !L.text) return;
      total++;
      const row=document.createElement('div');
      row.className='row'+(L.on?'':' off')+(L.edited?' manual':'');
      const cb=document.createElement('input');
      cb.type='checkbox'; cb.checked=L.on;
      const col=document.createElement('div');
      const src=document.createElement('div');
      src.className='src';
      src.textContent=(L.contOf?'⤷ 이어지는 줄  ':'')+(L.src.replace(/\t/g,'  ⇥  ')||'(빈 줄)');
      const ta=document.createElement('textarea');
      ta.className='out'; ta.rows=1; ta.value=lineOut(L,o);
      cb.onchange=function(){
        L.on=cb.checked;
        if(L.on && !L.text.trim()){          // 자동 추출에서 빠진 줄 → 원문을 채워 결과에 넣습니다
          L.text=fallbackText(L); L.speaker=''; L.edited=true;
          ta.value=L.text; row.classList.add('manual'); grow(ta);
          if(!L.text){ L.on=false; cb.checked=false; }
        }
        row.classList.toggle('off',!L.on);
        sync();
      };
      ta.oninput=function(){
        L.edited=true; L.text=ta.value; L.speaker='';
        L.on=!!ta.value.trim(); cb.checked=L.on;
        row.classList.add('manual'); row.classList.toggle('off',!L.on);
        grow(ta); sync();
      };
      col.appendChild(src); col.appendChild(ta);
      row.appendChild(cb); row.appendChild(col);
      frag.appendChild(row);
    });
  });
  box.innerHTML=''; box.appendChild(frag);
  Array.prototype.forEach.call(box.querySelectorAll('.out'),grow);
  rowCount=total;
  sync();
}

function collect(){
  const o=opts(), out=[];
  files.forEach(function(f){
    if(files.length>1){ if(out.length) out.push(''); out.push('# '+f.name); out.push(''); }
    let prevOn=true, last=-1;
    f.lines.forEach(function(L){
      if(L.on && L.text.trim()){
        if(o.merge && L.contOf && last>=0) out[last]=out[last]+' '+L.text.trim();
        else { out.push(L.edited?L.text:lineOut(L,o)); last=out.length-1; }
        prevOn=true;
      }
      else if(o.blank && prevOn){ out.push(''); prevOn=false; }
    });
  });
  while(out.length && out[out.length-1]==='') out.pop();
  return out;
}
function countInto(txt){
  const lines=txt.split('\n').filter(function(s){return s.trim();});
  $('cnt').textContent='· '+lines.length+'줄 / 공백제외 '+txt.replace(/\s/g,'').length+'자';
}
function sync(){
  const txt=collect().join('\n');
  $('result').value=txt;
  countInto(txt);
  let on=0;
  files.forEach(function(f){f.lines.forEach(function(L){if(L.on&&L.text.trim())on++;});});
  $('stat').textContent='줄 '+rowCount+'개 중 대사 '+on+'개 선택됨';
}

/* ── 파일 입력 ── */
async function load(fileList){
  const picked=Array.prototype.filter.call(fileList,function(f){return /\.docx$/i.test(f.name);});
  if(!picked.length){ toast('.docx 파일만 열 수 있습니다.'); return; }
  const next=[];
  for(const f of picked){
    try{
      const zip=await unzip(await f.arrayBuffer());
      const xml=await zip.text('word/document.xml');
      if(!xml){ toast(f.name+': 워드 문서가 아닌 것 같습니다.'); continue; }
      const styles=await zip.text('word/styles.xml');
      next.push({name:f.name,lines:docLines(xml,styles).map(function(d){
        return {src:d.src,indent:d.indent,cont:d.cont,
                text:'',speaker:'',on:false,edited:false,contOf:false};
      })});
    }catch(e){ toast(f.name+' 읽기 실패: '+e.message); }
  }
  if(!next.length) return;
  files=next; recompute();
  toast(next.length+'개 파일을 불러왔습니다.');
}
function loadText(text){
  // 워드에서 한 칸 안의 줄바꿈(Shift+Enter)은 수직탭으로 붙어옵니다.
  // 한 대사가 두 줄로 쪼개지지 않도록 띄어쓰기로 이어 붙입니다.
  const lines=text.replace(new RegExp(String.fromCharCode(11),'g'),' ').split(/\r\n|\r|\n/);
  if(!lines.some(function(s){return s.trim();})){ toast('붙여넣은 글이 비어 있습니다.'); return; }
  // 붙여넣기에서는 워드의 들여쓰기 설정이 사라지므로, 줄 앞의 탭·공백만이 단서입니다.
  files=[{name:'붙여넣은 글',lines:lines.map(function(s){
    return {src:s,indent:/^(\t| {2,})/.test(s)?720:0,cont:false,
            text:'',speaker:'',on:false,edited:false,contOf:false};
  })}];
  recompute();
}

/* ── 입력 방식 전환 ── */
function mode(which){
  const isFile=which==='file';
  $('tabFile').classList.toggle('sel',isFile);
  $('tabPaste').classList.toggle('sel',!isFile);
  $('drop').hidden=!isFile;
  $('paste').hidden=isFile;
  if(!isFile) setTimeout(function(){$('pasteText').focus();},0);
}
$('tabFile').onclick=function(){mode('file');};
$('tabPaste').onclick=function(){mode('paste');};

$('btnRunPaste').onclick=function(){loadText($('pasteText').value);};
$('btnClearPaste').onclick=function(){
  $('pasteText').value=''; files=[]; render(); $('pasteText').focus();
};
$('pasteText').addEventListener('paste',function(){
  setTimeout(function(){loadText($('pasteText').value);},0);
});
$('pasteText').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){ e.preventDefault(); loadText(this.value); return; }
  if(e.key==='Tab'){ // 탭키로 칸 구분자 직접 입력 (포커스 이동 대신)
    e.preventDefault();
    const s=this.selectionStart, t=this.selectionEnd;
    this.value=this.value.slice(0,s)+'\t'+this.value.slice(t);
    this.selectionStart=this.selectionEnd=s+1;
  }
});

$('drop').onclick=function(){$('file').click();};
$('file').onchange=function(e){load(e.target.files);};
['dragenter','dragover'].forEach(function(t){
  $('drop').addEventListener(t,function(e){e.preventDefault();$('drop').classList.add('over');});
});
['dragleave','drop'].forEach(function(t){
  $('drop').addEventListener(t,function(e){e.preventDefault();$('drop').classList.remove('over');});
});
$('drop').addEventListener('drop',function(e){load(e.dataTransfer.files);});
document.addEventListener('dragover',function(e){e.preventDefault();});
document.addEventListener('drop',function(e){e.preventDefault();});

Array.prototype.forEach.call(document.querySelectorAll('.opts input'),function(el){
  el.onchange=function(){
    (el.id==='o_speaker'||el.id==='o_blank'||el.id==='o_merge') ? render() : recompute();
  };
});
$('btnAll').onclick=function(){
  files.forEach(function(f){f.lines.forEach(function(L){if(L.text.trim())L.on=true;});}); render();
};
$('btnNone').onclick=function(){
  files.forEach(function(f){f.lines.forEach(function(L){L.on=false;});}); render();
};
$('btnCopy').onclick=async function(){
  const t=$('result').value;
  if(!t.trim()) return toast('추출된 대사가 없습니다.');
  try{ await navigator.clipboard.writeText(t); }
  catch(e){ $('result').select(); document.execCommand('copy'); }
  toast('복사했습니다.');
};
function save(blob,name){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob); a.download=name; a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);},1000);
}
function baseName(){return files.length?files[0].name.replace(/\.docx$/i,''):'대사';}
$('btnTxt').onclick=function(){
  if(!$('result').value.trim()) return toast('추출된 대사가 없습니다.');
  save(new Blob(['﻿'+$('result').value],{type:'text/plain;charset=utf-8'}),baseName()+'_대사.txt');
};
$('btnDocx').onclick=function(){
  if(!$('result').value.trim()) return toast('추출된 대사가 없습니다.');
  save(buildDocx($('result').value.split('\n')),baseName()+'_대사.docx');
};
$('result').oninput=function(){countInto($('result').value);};

let tt;
function toast(m){
  const el=$('toast'); el.textContent=m; el.classList.add('on');
  clearTimeout(tt); tt=setTimeout(function(){el.classList.remove('on');},2200);
}
</script>
